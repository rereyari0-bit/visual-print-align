services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Alamat backend yang bisa diakses browser pengguna (IP homelab)
        VITE_SUPABASE_URL: http://${HOMELAB_IP:-localhost}:8000
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_ANON_KEY}
    container_name: surat_perintah_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      SUPABASE_URL: http://${HOMELAB_IP:-localhost}:8000
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
